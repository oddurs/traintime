name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:network
      - run: npm run audit -- --url https://traintime-production-6a7d.up.railway.app || echo 'audit could not reach the deployed poller; not blocking'
      - run: npm run lint
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /traintime
          # The hosted poller gives the public site recorded history, replay and line health.
          NEXT_PUBLIC_POLLER_URL: ${{ vars.POLLER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
