name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:network
      - run: npm run audit -- --url https://traintime-production-6a7d.up.railway.app || echo 'audit could not reach the deployed poller; not blocking'
      - run: npm run lint
      - run: npm run audit:design
      # Needs a browser and a page; against the deployed site so it does not need a local server.
      - run: npm run audit:a11y -- https://oddurs.github.io/traintime || echo 'a11y audit could not run here; not blocking'
      - run: npm run build:pages
