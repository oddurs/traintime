name: CI

# Every push, main included. This used to skip main because the Pages workflow checked it on the
# way to publishing; that workflow is gone with Pages, and for a while nothing checked main at all.
on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:network
      - run: npm run audit -- --url https://traintime-production-6a7d.up.railway.app || echo 'audit could not reach the deployed poller; not blocking'
      - run: npm run lint
      - run: npm run audit:design
      # Needs a browser and a page; against the deployed site so it does not need a local server.
      - run: npm run audit:a11y -- https://traintime-site-production.up.railway.app || echo 'a11y audit could not run here; not blocking'
      - run: npm run build:pages
